<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F43F5E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#parentGrad)" opacity="0.1" stroke="url(#parentGrad)" stroke-width="2"/>
  
  <!-- Adult 1 (Left) -->
  <g transform="translate(65, 60)">
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="url(#parentGrad)"/>
    <!-- Body -->
    <rect x="-10" y="14" width="20" height="22" fill="url(#parentGrad)" rx="3"/>
    <!-- Left Arm -->
    <rect x="-16" y="18" width="8" height="18" fill="url(#parentGrad)" rx="4" transform="rotate(-25 -12 18)"/>
    <!-- Right Arm -->
    <rect x="8" y="18" width="8" height="18" fill="url(#parentGrad)" rx="4" transform="rotate(25 12 18)"/>
  </g>
  
  <!-- Adult 2 (Right) -->
  <g transform="translate(135, 60)">
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="url(#parentGrad)"/>
    <!-- Body -->
    <rect x="-10" y="14" width="20" height="22" fill="url(#parentGrad)" rx="3"/>
    <!-- Left Arm -->
    <rect x="-16" y="18" width="8" height="18" fill="url(#parentGrad)" rx="4" transform="rotate(-25 -12 18)"/>
    <!-- Right Arm -->
    <rect x="8" y="18" width="8" height="18" fill="url(#parentGrad)" rx="4" transform="rotate(25 12 18)"/>
  </g>
  
  <!-- Child -->
  <g transform="translate(100, 115)">
    <!-- Head -->
    <circle cx="0" cy="0" r="10" fill="url(#parentGrad)"/>
    <!-- Body -->
    <rect x="-8" y="10" width="16" height="18" fill="url(#parentGrad)" rx="2"/>
    <!-- Left Arm -->
    <rect x="-14" y="13" width="6" height="14" fill="url(#parentGrad)" rx="3" transform="rotate(-20 -11 13)"/>
    <!-- Right Arm -->
    <rect x="8" y="13" width="6" height="14" fill="url(#parentGrad)" rx="3" transform="rotate(20 11 13)"/>
  </g>
  
  <!-- Heart accent -->
  <g transform="translate(100, 35)">
    <path d="M 0 -3 C -2 -5 -5 -5 -6 -2 C -6.5 0 -4 2 0 4 C 4 2 6.5 0 6 -2 C 5 -5 2 -5 0 -3 Z" fill="url(#parentGrad)" opacity="0.8"/>
  </g>
</svg>