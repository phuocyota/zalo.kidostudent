<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#studentGrad)" opacity="0.1" stroke="url(#studentGrad)" stroke-width="2"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(100, 70)">
    <!-- Cap Top -->
    <path d="M -40 0 L 0 -30 L 40 0 Z" fill="url(#studentGrad)"/>
    <!-- Cap Front -->
    <rect x="-50" y="0" width="100" height="12" fill="url(#studentGrad)" rx="2"/>
    <!-- Tassel -->
    <line x1="0" y1="12" x2="0" y2="35" stroke="url(#studentGrad)" stroke-width="2"/>
    <circle cx="0" cy="38" r="4" fill="url(#studentGrad)"/>
  </g>
  
  <!-- Book -->
  <g transform="translate(100, 110)">
    <!-- Left Page -->
    <rect x="-25" y="0" width="20" height="35" fill="url(#studentGrad)" rx="2"/>
    <!-- Right Page -->
    <rect x="5" y="0" width="20" height="35" fill="url(#studentGrad)" opacity="0.7" rx="2"/>
    <!-- Spine -->
    <rect x="-5" y="0" width="10" height="35" fill="url(#studentGrad)" rx="1"/>
    <!-- Lines on pages -->
    <line x1="-22" y1="8" x2="-8" y2="8" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-22" y1="14" x2="-8" y2="14" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-22" y1="20" x2="-8" y2="20" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>